<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#201F1E" />
      <stop offset="100%" stop-color="#141413" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)" />
  <rect x="12" y="12" width="376" height="476" rx="12" fill="none" stroke="#D46238" stroke-opacity="0.35" stroke-width="2" />
  <!-- Terminal Header Dots -->
  <circle cx="36" cy="36" r="5" fill="#D46238" opacity="0.8" />
  <circle cx="54" cy="36" r="5" fill="#878683" opacity="0.4" />
  <circle cx="72" cy="36" r="5" fill="#878683" opacity="0.4" />
  <!-- Pixel Terminal CRT Avatar Center -->
  <g transform="translate(80, 110) scale(15)" shape-rendering="crispEdges">
    <rect x="2" y="2" width="12" height="9" fill="#D46238" />
    <rect x="2" y="2" width="12" height="1" fill="#E2764E" />
    <rect x="2" y="10" width="12" height="1" fill="#B84E27" />
    <rect x="3" y="3" width="10" height="7" fill="#181817" />
    <rect x="4" y="5" width="1" height="1" fill="#D46238" />
    <rect x="5" y="6" width="1" height="1" fill="#D46238" />
    <rect x="4" y="7" width="1" height="1" fill="#D46238" />
    <rect x="7" y="7" width="3" height="1" fill="#EDEDEC" />
    <rect x="6" y="11" width="4" height="1" fill="#B84E27" />
    <rect x="4" y="12" width="8" height="1" fill="#D46238" />
  </g>
  <text x="200" y="395" text-anchor="middle" fill="#EDEDEC" font-family="monospace" font-size="20" font-weight="bold">ALEX RIVERA</text>
  <text x="200" y="422" text-anchor="middle" fill="#D46238" font-family="monospace" font-size="13">STAFF SYSTEMS ENGINEER</text>
  <text x="200" y="455" text-anchor="middle" fill="#878683" font-family="monospace" font-size="11">[Replace /public/portrait.svg]</text>
